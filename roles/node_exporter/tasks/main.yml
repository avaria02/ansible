---
- name: Validate required variables
  ansible.builtin.assert:
    that:
      - node_exporter_listen_address is defined
      - ansible_service_mgr == 'systemd'
      - ansible_os_family in ['Debian', 'RedHat']
    fail_msg: >-
      node_exporter requires systemd on Debian or RedHat.

- name: Ensure node_exporter group exists
  ansible.builtin.group:
    name: "{{ node_exporter_group }}"
    system: true
    state: present

- name: Ensure node_exporter user exists
  ansible.builtin.user:
    name: "{{ node_exporter_user }}"
    group: "{{ node_exporter_group }}"
    system: true
    shell: /usr/sbin/nologin
    create_home: false
    state: present

- name: Install node_exporter from OS packages
  ansible.builtin.package:
    name: "{{ node_exporter_package_name }}"
    state: present

- name: Render systemd unit
  ansible.builtin.template:
    src: node_exporter.service.j2
    dest: "/etc/systemd/system/{{ node_exporter_service_name }}.service"
    owner: root
    group: root
    mode: '0644'
  notify: restart node_exporter

- name: Reload systemd
  ansible.builtin.systemd:
    daemon_reload: true

- name: Ensure service is enabled and running
  ansible.builtin.service:
    name: "{{ node_exporter_service_name }}"
    state: started
    enabled: true
